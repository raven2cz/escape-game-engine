# Runs the test suite. Without this the suite rots: main sat with 5 failing
# tests from February to September 2026 and nothing reported it.
name: tests

on:
  push:
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what the machine this is developed on runs, so dropping it would
        # stop testing what anyone actually sees. 22 is the supported LTS - 20
        # went end-of-life in April 2026 - and is what CI would otherwise be
        # silently ahead of. Keep both until the development machine moves.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
